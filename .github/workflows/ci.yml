name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The suite needs a real RethinkDB. It runs against a throwaway database
      # (see test/helpers/setup.js), never a live one.
      rethinkdb:
        image: rethinkdb:2.4
        ports:
          - 28015:28015

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Provide a config file
        # config.json is gitignored because it holds credentials. The example
        # is enough for the suite: the database name, session secret and mail
        # transport are all overridden by environment variables in setup.js.
        run: cp config-example.json config.json

      - name: Lint
        run: yarn lint

      - name: Test with coverage
        run: yarn test:coverage
        env:
          DB_HOST: localhost
          DB_PORT: 28015

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
